<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slider</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  #stage img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
    opacity: 0; transition: opacity .5s ease; pointer-events: none;
  }
  #stage img.on { opacity: 1; }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 56px; height: 56px; padding: 0; border: 0; background: none;
    color: #fff; cursor: pointer; opacity: .75; transition: opacity .2s;
    filter: drop-shadow(0 0 4px rgba(0,0,0,.55));
    -webkit-tap-highlight-color: transparent;
  }
  .arrow:hover, .arrow:focus-visible { opacity: 1; outline: none; }
  .arrow svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #prev { left: 4px; } #next { right: 4px; }
  @media (max-width: 600px) { .arrow { width: 44px; height: 44px; } .arrow svg { width: 24px; height: 24px; } }

  /* 하단 점 표시 */
  #dots {
    position: absolute; left: 0; right: 0; bottom: 6px;
    display: flex; justify-content: center; flex-wrap: wrap;
    pointer-events: none;
  }
  #dots button {
    pointer-events: auto; width: 22px; height: 22px; padding: 0; border: 0; background: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  #dots button::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; opacity: .45; transition: opacity .2s, transform .2s;
    filter: drop-shadow(0 0 3px rgba(0,0,0,.6));
  }
  #dots button.on::before { opacity: 1; transform: scale(1.25); }
  #dots button:focus-visible { outline: none; }

  .hide { display: none; }
</style>
</head>
<body>
<div id="stage">
  <button id="prev" class="arrow" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
  <button id="next" class="arrow" aria-label="다음"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
  <div id="dots"></div>
</div>

<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const set = q.get('set');
  const auto = q.has('auto') ? parseFloat(q.get('auto')) : 4;
  const showDots = q.get('dots') !== '0';   // 점 끄기: &dots=0
  const stage = document.getElementById('stage');
  const dotsBox = document.getElementById('dots');

  let list = [];
  try {
    const res = await fetch('slides.json', { cache: 'no-cache' });
    const data = await res.json();
    list = data[set] || [];
  } catch (e) { console.error(e); }

  if (!list.length) return;

  const imgs = list.map((src, i) => {
    const im = new Image();
    im.src = src; im.alt = '';
    im.decoding = 'async';
    if (i > 1) im.loading = 'lazy';
    stage.insertBefore(im, document.getElementById('prev'));
    return im;
  });

  // 점 만들기
  const dots = imgs.map((_, i) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', (i + 1) + '번째 사진');
    b.onclick = () => go(i);
    dotsBox.appendChild(b);
    return b;
  });

  let cur = 0, timer;
  function show(n) {
    imgs[cur].classList.remove('on');
    dots[cur].classList.remove('on');
    cur = (n + imgs.length) % imgs.length;
    imgs[cur].classList.add('on');
    dots[cur].classList.add('on');
    const nx = imgs[(cur + 1) % imgs.length]; nx.loading = 'eager';
  }
  function stop() { clearInterval(timer); }
  function restart() {
    stop();
    if (auto > 0 && imgs.length > 1) timer = setInterval(() => show(cur + 1), auto * 1000);
  }
  function go(n) { show(n); restart(); }

  if (imgs.length < 2) {
    document.querySelectorAll('.arrow').forEach(a => a.classList.add('hide'));
    dotsBox.classList.add('hide');
  }
  if (!showDots) dotsBox.classList.add('hide');

  document.getElementById('prev').onclick = () => go(cur - 1);
  document.getElementById('next').onclick = () => go(cur + 1);
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') go(cur - 1);
    if (e.key === 'ArrowRight') go(cur + 1);
  });

  // 마우스를 올리면 잠시 멈춤 (마우스가 있는 기기에서만)
  if (window.matchMedia('(hover: hover)').matches) {
    stage.addEventListener('mouseenter', stop);
    stage.addEventListener('mouseleave', restart);
  }

  // 스와이프
  let x0 = null;
  stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1));
    x0 = null;
  });

  show(0); restart();
})();
</script>
</body>
</html>
